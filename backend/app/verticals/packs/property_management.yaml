# Taskmaster vertical config pack — Property Management
key: property_management
display_name: "Property Management"
business_description: >
  Tenant-facing intake for a residential property management company covering maintenance
  requests, lease questions, and complaints.

issue_types:
  - name: maintenance_request
    description: Repairs needed in a unit or common area (appliances, plumbing, general upkeep).
    examples:
      - "Refrigerator stopped working"
      - "Dishwasher doesn't drain fully"
  - name: lease_question
    description: Questions about lease terms, renewals, move-in/move-out, or rent.
    examples:
      - "When does my lease renew?"
      - "How do I give notice that I'm moving out?"
  - name: complaint
    description: Noise complaints, neighbor disputes, or dissatisfaction with property conditions.
    examples:
      - "My upstairs neighbor is extremely loud every night"
      - "The hallway hasn't been cleaned in weeks"
  - name: amenity_access
    description: Issues with keys, fobs, gate codes, or shared amenities (gym, pool, parking).
    examples:
      - "My key fob stopped working"
      - "Can I get an extra parking pass?"
  - name: other
    description: General questions not covered by the categories above.
    examples:
      - "What's the office's holiday schedule?"

urgency_rules:
  - level: CRITICAL
    definition: >
      No heat/AC in extreme weather, no water, a gas smell, or a safety hazard such as a
      broken lock or exposed wiring.
    concrete_examples:
      - "I smell gas in my kitchen"
      - "Front door lock is broken and won't lock"
      - "No water in the whole unit"
  - level: HIGH
    definition: A major appliance or system is broken with real daily impact.
    concrete_examples:
      - "Refrigerator stopped working"
      - "Toilet is completely clogged and unusable"
  - level: MEDIUM
    definition: Inconvenient but livable.
    concrete_examples:
      - "Dishwasher doesn't drain fully"
      - "Squeaky door hinge"
  - level: LOW
    definition: Non-urgent questions or minor requests.
    concrete_examples:
      - "When does my lease renew?"
      - "Can I get an extra parking pass?"

required_entities:
  - name: unit_number
    description: The tenant's unit or apartment number.
  - name: issue_location
    description: Where the issue is located (e.g. kitchen, bathroom, common area).
  - name: access_permission
    description: Whether management has permission to enter the unit if the tenant is away.

appointment_types:
  - name: emergency_repair
    duration_minutes: 60
    requires_onsite: true
    triggers_when: CRITICAL urgency maintenance requests.
  - name: scheduled_maintenance
    duration_minutes: 90
    requires_onsite: true
    triggers_when: HIGH or MEDIUM urgency maintenance requests.
  - name: office_consultation
    duration_minutes: 30
    requires_onsite: false
    triggers_when: Lease questions or complaints that need a discussion, not a repair.

reply_tone: >
  Professional and empathetic — acknowledge frustration about living conditions while being
  clear about next steps and timelines.

business_hours:
  monday: {open: "09:00", close: "17:00"}
  tuesday: {open: "09:00", close: "17:00"}
  wednesday: {open: "09:00", close: "17:00"}
  thursday: {open: "09:00", close: "17:00"}
  friday: {open: "09:00", close: "17:00"}
  saturday: {open: null, close: null}
  sunday: {open: null, close: null}

timezone: "America/Los_Angeles"

sla_by_priority:
  CRITICAL: {first_response_minutes: 20, resolution_hours: 6}
  HIGH: {first_response_minutes: 60, resolution_hours: 24}
  MEDIUM: {first_response_minutes: 240, resolution_hours: 72}
  LOW: {first_response_minutes: 480, resolution_hours: 120}

routing_table:
  - {issue_type: maintenance_request, urgency: CRITICAL, assignee_role: emergency_maintenance_tech}
  - {issue_type: maintenance_request, assignee_role: maintenance_tech}
  - {issue_type: lease_question, assignee_role: leasing_agent}
  - {issue_type: complaint, assignee_role: property_manager}
  - {issue_type: amenity_access, assignee_role: office_staff}
  - {issue_type: other, assignee_role: office_staff}

default_assignee_role: office_staff
